name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Pre-deploy CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @kashmir/web exec tsc --noEmit
      - run: pnpm --filter @kashmir/web exec eslint . --max-warnings 0
      - run: pnpm --filter @kashmir/web exec jest --ci
      - run: pnpm --filter @kashmir/web exec next build

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: ci
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @kashmir/web exec prisma migrate deploy
      - name: Deploy app
        run: |
          npm i -g @railway/cli
          railway up --service "$RAILWAY_SERVICE"
      - name: Smoke test
        run: |
          curl -fsS "$STAGING_URL/api/health"
      - name: Post deployment url to PR
        if: ${{ github.event.head_commit.message != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const commit = context.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: commit
            });
            for (const pr of prs.data) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `🚀 Staging deployed successfully: ${process.env.STAGING_URL}`
              });
            }
