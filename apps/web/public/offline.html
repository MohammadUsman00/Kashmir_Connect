<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kashmir Connect Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #faf6ef;
        color: #3d1f0d;
      }
      .card {
        max-width: 420px;
        padding: 24px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid #e6d8c5;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Kashmir Connect will sync automatically when your internet is restored.</p>
    </main>
  </body>
</html>
